<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Blind-Tippen – Arcade Neon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a1a;
  --fg: #e0e0ff;
  --dim: #5555aa;
  --cyan: #00f0ff;
  --magenta: #ff00ff;
  --yellow: #ffe600;
  --green: #00ff88;
  --red: #ff2255;
  --card: rgba(0, 240, 255, 0.04);
  --border: rgba(0, 240, 255, 0.25);
  --glow-cyan: 0 0 6px rgba(0,240,255,0.5), 0 0 12px rgba(0,240,255,0.2);
  --glow-magenta: 0 0 6px rgba(255,0,255,0.5), 0 0 12px rgba(255,0,255,0.2);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Orbitron', monospace;
  min-height: 100vh;
}
/* Subtle grid background */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}
/* Scanlines */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.12) 2px,
    rgba(0, 0, 0, 0.12) 4px
  );
  pointer-events: none;
  z-index: 9999;
}
#app {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: relative;
  z-index: 1;
}
h1 {
  font-size: 1.5rem;
  margin: 0;
  text-align: center;
  color: var(--cyan);
  text-shadow: var(--glow-cyan);
  letter-spacing: 0.15em;
  font-weight: 900;
}
h2, h3 {
  font-size: 0.8rem;
  margin: 0;
  color: var(--dim);
  letter-spacing: 0.1em;
}
.timer {
  font-size: clamp(2rem, 8vw, 3.5rem);
  font-weight: 900;
  text-align: center;
  color: var(--magenta);
  text-shadow: var(--glow-magenta);
  font-variant-numeric: tabular-nums;
}
.text {
  font-size: clamp(1rem, 3vw, 1.5rem);
  line-height: 2;
  text-align: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px;
  word-break: break-word;
}
.char.typed { color: var(--dim); }
.char.next {
  background: var(--cyan);
  color: #0a0a1a;
  border-radius: 2px;
  box-shadow: var(--glow-cyan);
  animation: pulse 1.2s ease-in-out infinite;
}
.char.error {
  background: var(--red);
  color: #fff;
  border-radius: 2px;
  box-shadow: 0 0 8px rgba(255,34,85,0.5);
}
@keyframes pulse {
  0%, 100% { box-shadow: var(--glow-cyan); }
  50% { box-shadow: 0 0 12px rgba(0,240,255,0.8), 0 0 24px rgba(0,240,255,0.3); }
}
.keyboard {
  display: flex;
  flex-direction: column;
  gap: 5px;
  align-items: center;
}
.kb-row { display: flex; gap: 4px; }
.key {
  width: clamp(24px, 7vw, 44px);
  height: clamp(32px, 9vw, 52px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: clamp(0.7rem, 2.2vw, 1rem);
  color: var(--dim);
}
.key-space { width: clamp(120px, 55vw, 260px); }
.key-finger { color: var(--cyan); border-color: rgba(0,240,255,0.4); }
.key-next {
  background: var(--cyan);
  color: #0a0a1a;
  box-shadow: var(--glow-cyan);
  border-color: var(--cyan);
}
.hint {
  text-align: center;
  color: var(--dim);
  margin: 0;
  font-size: 0.8rem;
}
.bottom {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  justify-content: space-between;
}
.stats {
  display: flex;
  gap: 24px;
  align-items: baseline;
}
.stat-value {
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--green);
  text-shadow: 0 0 8px rgba(0,255,136,0.4);
}
.stat span:last-child {
  color: var(--dim);
  font-size: 0.7rem;
}
.board {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 220px;
}
.board li {
  display: flex;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 8px 12px;
}
.board .rank { color: var(--yellow); width: 2em; }
.board .nick { flex: 1; }
.board .wertung { color: var(--cyan); font-variant-numeric: tabular-nums; }
.board li.me { border-color: var(--magenta); box-shadow: var(--glow-magenta); }
.board li.winner .nick::after { content: " ★"; color: var(--yellow); }
.players {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.players li {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 8px 12px;
}
.players li.me { border-color: var(--magenta); box-shadow: var(--glow-magenta); }
.controls {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
}
.durations { display: flex; gap: 8px; }
.btn {
  background: var(--card);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 10px 16px;
  font-family: inherit;
  font-size: 0.85rem;
  cursor: pointer;
  transition: box-shadow 0.2s;
}
.btn:hover {
  box-shadow: var(--glow-cyan);
  border-color: var(--cyan);
}
.btn.active { border-color: var(--yellow); color: var(--yellow); box-shadow: 0 0 6px rgba(255,230,0,0.3); }
.btn.primary {
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  color: #0a0a1a;
  border: none;
  font-weight: 700;
  box-shadow: var(--glow-cyan);
}
.waiting, .disconnected {
  color: var(--dim);
  text-align: center;
}
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 26, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.overlay-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: min(90vw, 380px);
}
.row { display: flex; gap: 8px; }
.nickname {
  flex: 1;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 10px 12px;
  font-family: inherit;
  font-size: 1rem;
}
</style>
</head>
<body>
<div id="app">
  <h1>⬡ BLIND-TIPPEN ⬡</h1>
  <div class="timer">1:30</div>
  <div class="text">
    <span class="char typed">D</span><span class="char typed">a</span><span class="char typed">s</span><span class="char typed"> </span><span class="char typed">T</span><span class="char next">i</span><span class="char">p</span><span class="char">p</span><span class="char">e</span><span class="char">n</span><span class="char"> </span><span class="char">i</span><span class="char">s</span><span class="char">t</span><span class="char"> </span><span class="char">k</span><span class="char">e</span><span class="char">i</span><span class="char">n</span><span class="char"> </span><span class="char">S</span><span class="char">p</span><span class="char">a</span><span class="char">s</span><span class="char">s</span><span class="char"> </span><span class="char">f</span><span class="char">ü</span><span class="char">r</span><span class="char"> </span><span class="char">d</span><span class="char">i</span><span class="char">e</span><span class="char"> </span><span class="char">F</span><span class="char">u</span><span class="char">n</span><span class="char">k</span><span class="char">t</span><span class="char">i</span><span class="char">o</span><span class="char">n</span><span class="char">s</span><span class="char">t</span><span class="char">a</span><span class="char">r</span><span class="char">t</span>
  </div>
  <div class="keyboard">
    <div class="kb-row">
      <div class="key key-finger">Q</div><div class="key key-finger">W</div><div class="key key-finger">E</div><div class="key key-finger">R</div><div class="key key-finger">T</div><div class="key key-finger">Z</div><div class="key key-finger">U</div><div class="key key-finger">I</div><div class="key key-finger">O</div><div class="key key-finger">P</div>
    </div>
    <div class="kb-row">
      <div class="key key-finger">A</div><div class="key key-finger">S</div><div class="key key-finger">D</div><div class="key key-next">F</div><div class="key key-finger">G</div><div class="key key-finger">H</div><div class="key key-finger">J</div><div class="key key-finger">K</div><div class="key key-finger">L</div>
    </div>
    <div class="kb-row">
      <div class="key key-finger">Y</div><div class="key key-finger">X</div><div class="key key-finger">C</div><div class="key key-finger">V</div><div class="key key-finger">B</div><div class="key key-finger">N</div><div class="key key-finger">M</div>
    </div>
    <div class="kb-row">
      <div class="key key-space key-finger">LEER</div>
    </div>
  </div>
  <p class="hint">Zeigefinger rechts</p>
  <div class="bottom">
    <div class="stats">
      <div class="stat"><span class="stat-value">52</span> <span>WPM</span></div>
      <div class="stat"><span class="stat-value">94%</span> <span>TREFFER</span></div>
    </div>
    <div>
      <h3>RANGLISTE</h3>
      <ol class="board">
        <li class="me"><span class="rank">1.</span><span class="nick">MegaTyper</span><span class="wertung">1580</span></li>
        <li><span class="rank">2.</span><span class="nick">PixelPete</span><span class="wertung">1320</span></li>
        <li><span class="rank">3.</span><span class="nick">ByteBea</span><span class="wertung">990</span></li>
      </ol>
    </div>
  </div>
</div>
</body>
</html>
